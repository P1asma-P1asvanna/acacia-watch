<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body style="margin:0"><title>Acacia Watch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:wght@600;700&family=Sarabun:wght@400;500;700&display=swap">
<style>
/* Layout: split screen. Dark ink sidebar on the left, working area on the right; on phones the sidebar becomes a scrolling top bar.
   Palette: verdigris accent on cool stone, brass kept for dice and highlights only. */
:root{
  --bg:#eceff0; --surface:#fafbfb; --ink:#1b2422; --muted:#5a6a66; --line:#d2d9d7;
  --accent:#1d6b64; --accent-ink:#ffffff; --brass:#8f6212; --gold:#c8901a; --temp:#2f6aa8; --turn-now:#c8901a; --turn-next:#4f86b3; --turn-done:#8b9590; --danger:#a3322a;
  --side:#16201e; --side-ink:#e4ebe8; --side-muted:#8fa19c; --side-line:#2a3935; --side-active:#24342f;
  --r:8px; --display:'Alegreya','Sarabun',Georgia,serif; --body:'Sarabun','Segoe UI',system-ui,sans-serif; --mono:'IBM Plex Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101614; --surface:#18211e; --ink:#e5ece9; --muted:#94a5a0; --line:#2b3935;
  --accent:#4fb3a9; --accent-ink:#09130f; --brass:#d6a54b; --gold:#e3b449; --temp:#6aa6e6; --turn-now:#e3b449; --turn-next:#6aa6d4; --turn-done:#6c7873; --danger:#e57d72;
  --side:#0b100f; --side-ink:#e4ebe8; --side-muted:#8fa19c; --side-line:#22302c; --side-active:#1b2926; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101614; --surface:#18211e; --ink:#e5ece9; --muted:#94a5a0; --line:#2b3935;
  --accent:#4fb3a9; --accent-ink:#09130f; --brass:#d6a54b; --gold:#e3b449; --temp:#6aa6e6; --turn-now:#e3b449; --turn-next:#6aa6d4; --turn-done:#6c7873; --danger:#e57d72;
  --side:#0b100f; --side-ink:#e4ebe8; --side-muted:#8fa19c; --side-line:#22302c; --side-active:#1b2926; color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
h1,h2,h3{font-family:var(--display);line-height:1.2;margin:0;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* shared controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;min-height:38px;padding:0 .95rem;border-radius:calc(var(--r)*.75);border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.small{min-height:30px;padding:0 .6rem;font-size:.85rem}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.field{display:flex;flex-direction:column;gap:.3rem;min-width:0}
.field>label,.lbl{font-size:.78rem;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);font-weight:500}
.field input,.field select,.field textarea{width:100%;min-height:38px;padding:.4rem .6rem;border:1px solid var(--line);border-radius:calc(var(--r)*.75);background:var(--surface)}
.field textarea{min-height:90px;resize:vertical}
.err{color:var(--danger);font-size:.9rem;min-height:1.3em}
.muted{color:var(--muted)}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:calc(var(--r)*.75);overflow:hidden}
.lang button{border:0;background:transparent;padding:.2rem .6rem;cursor:pointer;font-size:.82rem;font-weight:500}
.lang button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}

/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-left,0px)) 24px max(16px,env(safe-area-inset-right,0px))}
.login-card{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--line);border-radius:calc(var(--r)*1.25);padding:28px 26px;display:flex;flex-direction:column;gap:16px}
.login-top{display:flex;justify-content:space-between;align-items:center}
.brand{display:flex;align-items:center;gap:.6rem;font-family:var(--display);font-weight:700;font-size:1.45rem}
.brand svg{width:30px;height:30px;color:var(--brass)}
.tabs{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--line)}
.tabs button{background:none;border:0;padding:.6rem;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;font-weight:500}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
form.stack{display:flex;flex-direction:column;gap:12px}
.note{font-size:.85rem;color:var(--muted)}

/* app shell */
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
.side{background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;gap:20px;padding:20px 16px;position:sticky;top:0;height:100vh}
.side .brand{color:var(--side-ink)}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{display:flex;align-items:center;gap:.7rem;text-align:left;padding:.6rem .7rem;border:0;border-radius:calc(var(--r)*.75);background:transparent;color:var(--side-muted);cursor:pointer;font-weight:500}
.nav button svg{width:18px;height:18px;flex:none}
.nav button:hover{color:var(--side-ink)}
.nav button[aria-current="page"]{background:var(--side-active);color:var(--side-ink);box-shadow:inset 3px 0 0 var(--brass)}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--side-line);padding-top:14px}
.me{display:flex;flex-direction:column}
.me b{font-weight:700}
.me span{font-size:.8rem;color:var(--side-muted)}
.side .lang{border-color:var(--side-line);align-self:flex-start}
.side .lang button{color:var(--side-muted)}
.side .lang button[aria-pressed="true"]{color:var(--accent-ink)}
.side .btn{background:transparent;border-color:var(--side-line);color:var(--side-ink)}
.main{padding:28px max(16px,env(safe-area-inset-right,0px)) 48px 32px;min-width:0;display:flex;flex-direction:column;gap:22px}
.head{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:flex-end}
.head h1{font-size:1.9rem}
.head p{margin:.2rem 0 0;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.panel>.ph{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.panel>.ph h2{font-size:1.2rem}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:620px}
th{text-align:left;font-size:.75rem;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:500;padding:10px 16px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td .sub{display:block;font-size:.82rem;color:var(--muted)}
.acts{display:flex;gap:6px;justify-content:flex-end}
.pill{display:inline-block;padding:.1rem .55rem;border:1px solid var(--line);border-radius:999px;font-size:.78rem;color:var(--muted)}
.pill.admin{border-color:var(--brass);color:var(--brass)}
.empty{padding:34px 18px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;color:var(--muted)}

/* editor */
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));padding:16px}
.grid.wide{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.abilities{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:12px;padding:16px}
.ab{border:1px solid var(--line);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;align-items:center;gap:6px}
.ab .k{font-family:var(--mono);font-size:.8rem;color:var(--muted)}
.ab input{text-align:center;width:100%;min-height:36px;border:1px solid var(--line);border-radius:calc(var(--r)*.75);background:var(--surface);font-variant-numeric:tabular-nums}
.ab .mod{font-family:var(--display);font-weight:700;font-size:1.5rem;font-variant-numeric:tabular-nums}
.derived{display:flex;flex-wrap:wrap;gap:10px;padding:0 16px 16px}
.chip{border:1px solid var(--line);border-radius:var(--r);padding:8px 12px;display:flex;flex-direction:column;min-width:110px}
.chip span{font-size:.72rem;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.chip b{font-family:var(--display);font-size:1.3rem;font-variant-numeric:tabular-nums}
.bar{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;padding:14px 16px}

/* minigames */
.games{display:grid;gap:18px;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)}
.dice{display:flex;flex-wrap:wrap;gap:8px;padding:16px 16px 4px}
.dice button{min-width:52px;min-height:44px;border-radius:calc(var(--r)*.75);border:1px solid var(--line);background:var(--surface);cursor:pointer;font-family:var(--mono)}
.dice button[aria-pressed="true"]{border-color:var(--brass);color:var(--brass);box-shadow:inset 0 0 0 1px var(--brass)}
.roll-ctl{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;padding:12px 16px}
.roll-ctl .field{width:92px}
.result{margin:4px 16px 16px;border:1px dashed var(--brass);border-radius:var(--r);padding:16px;text-align:center;min-height:116px;display:flex;flex-direction:column;justify-content:center;gap:4px}
.result .big{font-family:var(--display);font-weight:700;font-size:3rem;line-height:1;color:var(--brass);font-variant-numeric:tabular-nums}
.result .det{font-family:var(--mono);font-size:.85rem;color:var(--muted)}
.hist{list-style:none;margin:0;padding:6px 16px 16px;display:flex;flex-direction:column;gap:6px}
.hist li{display:flex;justify-content:space-between;gap:10px;font-family:var(--mono);font-size:.85rem;border-bottom:1px solid var(--line);padding-bottom:6px}
.plan{margin:0;padding:12px 16px 16px 34px;display:flex;flex-direction:column;gap:6px}

/* game data */
.tabs2{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line)}
.tabs2 button{background:none;border:0;border-bottom:2px solid transparent;padding:.55rem .85rem;cursor:pointer;color:var(--muted);font-weight:500;white-space:nowrap}
.tabs2 button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.cnt{font-family:var(--mono);font-size:.75rem;color:var(--muted);margin-left:.25rem}
.field.full{grid-column:1/-1}
.subs{display:flex;flex-direction:column;gap:12px;padding:16px}
.subrow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) auto;gap:10px;align-items:end;border:1px solid var(--line);border-radius:var(--r);padding:12px}
/* adventure stage */
.app.stagemode{height:100vh;height:100dvh}
.main.stage{height:100vh;height:100dvh;overflow:hidden;padding-top:16px;padding-bottom:16px;gap:12px}
.stagebar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;min-width:0}
.stagebar h1{font-size:1.4rem}
.gtabs{display:flex;gap:6px;overflow-x:auto;margin-left:auto;min-width:0;max-width:100%}
.gtab{white-space:nowrap;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:.3rem .9rem;cursor:pointer;font-weight:500}
.gtab[aria-selected="true"]{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.gtab:disabled{opacity:.55;cursor:not-allowed}
.soon{font-size:.68rem;letter-spacing:.05em;text-transform:uppercase;margin-left:.5rem;color:var(--muted)}
.stagebody{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:16px}
.stagemain{min-height:0;min-width:0;overflow-y:auto}
.rail{min-height:0;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.rail-head{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);font-family:var(--display);font-weight:700}
.rail-list{flex:1;min-height:0;display:flex;flex-direction:column;gap:6px;padding:8px;container-type:size}
.seat{flex:1 1 0;min-height:0;display:flex;align-items:center;gap:10px;border:1px dashed var(--line);border-radius:calc(var(--r)*.75);padding:0 10px;overflow:hidden;font-size:clamp(.68rem,calc(100cqh / var(--n) * .2),1rem)}
.seat.filled{border-style:solid;background:color-mix(in srgb,var(--accent) 8%,var(--surface))}
.av{flex:none;display:grid;place-items:center;border-radius:50%;background:var(--side);color:var(--side-ink);font-family:var(--display);font-weight:700;width:clamp(24px,calc(100cqh / var(--n) * .5),56px);height:clamp(24px,calc(100cqh / var(--n) * .5),56px)}
.seat-body{min-width:0;flex:1;display:flex;flex-direction:column;justify-content:center}
.seat-pick{width:100%;min-height:0;padding:0;border:0;background:transparent;font-weight:700;font-size:1em;text-overflow:ellipsis;cursor:pointer}
.seat:not(.filled) .seat-pick{font-weight:400;color:var(--muted)}
.seat-line2,.seat-stats{color:var(--muted);font-size:.85em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seat-stats{display:flex;gap:10px;font-family:var(--mono)}
.d2 .seat-line2,.d3 .seat-line2,.d3 .av{display:none}
.d3 .seat-body{flex-direction:row;align-items:center;gap:8px}
.d3 .seat-pick{flex:1;min-width:0}
/* button effects (admin picks style, speed, strength, color in site settings) */
:root{--fx-ms:160ms;--fx-amt:3;--fx-color:var(--accent)}
.btn,.gtab,.dice button{position:relative;touch-action:manipulation;-webkit-tap-highlight-color:transparent;transition:transform var(--fx-ms) cubic-bezier(.2,.7,.3,1),border-color .15s,background-color .15s,color .15s}
.btn::after,.gtab::after,.dice button::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity var(--fx-ms) ease}
html[data-fx=glow] .btn::after,html[data-fx=glow] .gtab::after,html[data-fx=glow] .dice button::after{box-shadow:0 0 calc(var(--fx-amt)*3px) calc(var(--fx-amt)*.5px) var(--fx-color)}
html[data-fx=lift] .btn::after,html[data-fx=lift] .gtab::after,html[data-fx=lift] .dice button::after{box-shadow:0 calc(var(--fx-amt)*2px) calc(var(--fx-amt)*3px) color-mix(in srgb,var(--fx-color) 40%,transparent)}
html[data-fx=shine] .btn,html[data-fx=shine] .gtab,html[data-fx=shine] .dice button{overflow:hidden}
html[data-fx=shine] .btn::before,html[data-fx=shine] .gtab::before,html[data-fx=shine] .dice button::before{content:"";position:absolute;top:0;bottom:0;left:0;width:55%;background:linear-gradient(100deg,transparent,color-mix(in srgb,var(--fx-color) 55%,#fff),transparent);opacity:.55;transform:translateX(-140%) skewX(-18deg);pointer-events:none}
@media (hover:hover){
 html[data-fx=lift] .btn:not([disabled]):hover,html[data-fx=lift] .gtab:not(:disabled):hover,html[data-fx=lift] .dice button:hover{transform:translateY(calc(var(--fx-amt)*-1px))}
 html[data-fx=bounce] .btn:not([disabled]):hover,html[data-fx=bounce] .gtab:not(:disabled):hover,html[data-fx=bounce] .dice button:hover{transform:scale(calc(1 + var(--fx-amt) / 100));transition-timing-function:cubic-bezier(.34,1.56,.64,1)}
 html[data-fx=lift] .btn:not([disabled]):hover::after,html[data-fx=glow] .btn:not([disabled]):hover::after,html[data-fx=lift] .gtab:not(:disabled):hover::after,html[data-fx=glow] .gtab:not(:disabled):hover::after,html[data-fx=lift] .dice button:hover::after,html[data-fx=glow] .dice button:hover::after{opacity:1}
 html[data-fx=shine] .btn:not([disabled]):hover::before,html[data-fx=shine] .gtab:not(:disabled):hover::before,html[data-fx=shine] .dice button:hover::before{transform:translateX(280%) skewX(-18deg);transition:transform calc(var(--fx-ms)*3) ease}
}
html:not([data-fx=none]) .btn:not([disabled]):active,html:not([data-fx=none]) .gtab:not(:disabled):active,html:not([data-fx=none]) .dice button:active{transform:scale(.96)}
.fxprev{display:flex;gap:12px;flex-wrap:wrap;align-items:center;padding:0 16px 16px}
@media (prefers-reduced-motion:reduce){.btn,.gtab,.dice button,.btn::before,.btn::after,.gtab::before,.gtab::after{transition:none!important}html .btn:hover,html .btn:active,html .gtab:hover,html .gtab:active,html .dice button:hover,html .dice button:active{transform:none!important}}
/* background and class extras, items, weapons, proficiencies */
.featrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:end;border:1px solid var(--line);border-radius:var(--r);padding:12px}
.featrow.withlvl{grid-template-columns:minmax(0,1fr) 110px auto}
.featrow .field.full{grid-column:1/-1}
.chkgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:6px 12px;padding:14px 16px}
.chk{display:flex;gap:8px;align-items:center;min-height:36px;cursor:pointer}
.chk input{width:18px;height:18px;flex:none}
.chk .pa,.pa{margin-left:auto;font-family:var(--mono);font-size:.7rem;color:var(--muted)}
.items{list-style:none;margin:0;padding:0 16px 8px;display:flex;flex-direction:column;gap:8px}
.irow{display:grid;grid-template-columns:minmax(0,1fr) 72px auto auto;gap:8px;align-items:center}
.irow input,.wb{min-height:36px;border:1px solid var(--line);border-radius:calc(var(--r)*.75);background:var(--surface);padding:0 .6rem;width:100%}
.iqty,.wb{text-align:center}
.bkbody{padding:16px;display:flex;flex-direction:column;gap:12px}
.bkrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.bktext{width:100%;min-height:120px;font-family:var(--mono);font-size:.8rem;border:1px solid var(--line);border-radius:calc(var(--r)*.75);background:var(--surface);color:var(--ink);padding:8px;resize:vertical}
.icell{display:flex;gap:8px;align-items:center;white-space:nowrap}
.eqw{display:flex;gap:6px;align-items:center;font-size:.9rem;cursor:pointer}
.irow .eqw input{width:18px;height:18px;min-height:0;padding:0}
.wlist{list-style:none;margin:0;padding:0}
.whead,.wrow{display:grid;grid-template-columns:minmax(0,1.6fr) 64px minmax(0,1.4fr) auto 64px auto;gap:10px;align-items:center;padding:8px 16px;border-top:1px solid var(--line)}
.whead{font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);border-top:0}
.wn b{display:block;overflow:hidden;text-overflow:ellipsis}
.wn small,.wa small{display:block;color:var(--muted);font-size:.78rem}
.wa{text-align:center;font-family:var(--display);font-weight:700;font-size:1.25rem;font-variant-numeric:tabular-nums}
.wd{font-family:var(--mono);font-size:.85rem}
.wp{display:flex;gap:6px;align-items:center;white-space:nowrap;font-size:.85rem}
.wp input{width:18px;height:18px}
.kvr{display:grid;grid-template-columns:140px minmax(0,1fr);gap:12px;padding:7px 16px;border-top:1px solid var(--line)}
.kvr .k{color:var(--muted);text-align:right;font-size:.9rem}
.featwrap{padding:0 16px 14px;display:flex;flex-direction:column;gap:8px}
details.feat{border:1px solid var(--line);border-radius:calc(var(--r)*.75);padding:8px 12px}
details.feat summary{cursor:pointer;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.featd{margin-top:8px;font-size:.92rem}
@media(max-width:700px){
 input,select,textarea{font-size:16px}
 .whead{display:none}
 .wrow{grid-template-columns:minmax(0,1fr) 64px}
 .wrow>.wd{grid-column:1/-1}
 .kvr{grid-template-columns:1fr;gap:2px}.kvr .k{text-align:left}
 .featrow.withlvl{grid-template-columns:minmax(0,1fr) 90px auto}
}
.stagemain,.scroll{overscroll-behavior:contain}
.panel{contain:layout style}
#acbody,#profbody,#hpbody,#wbody,#featbody,#profsrows,#itbody{contain:layout style}
.netbar{position:fixed;left:12px;right:12px;bottom:12px;z-index:50;background:var(--danger);color:#fff;padding:10px 14px;border-radius:var(--r);font-weight:600;box-shadow:0 4px 16px rgba(0,0,0,.3)}
.pwrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pwrow input{min-height:36px;width:150px;border:1px solid var(--line);border-radius:calc(var(--r)*.75);background:var(--surface);padding:0 .6rem}
/* initiative */
.ini{display:flex;flex-direction:column;gap:14px}
.ini-top{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:14px 16px}
.ini-round{font-family:var(--display);font-weight:700;font-size:1.4rem;margin-right:auto;font-variant-numeric:tabular-nums}
.ini-add{display:flex;gap:10px 16px;flex-wrap:wrap;align-items:flex-end;padding:0 16px 14px}
.ini-add .field{min-width:0}
.ini-add .sm{width:84px}
.ini-list{list-style:none;margin:0;padding:0}
.ini-row{display:grid;grid-template-columns:28px minmax(0,1fr) 84px auto auto;gap:10px;align-items:center;padding:8px 16px;border-top:1px solid var(--line)}
.ini-row.now{background:color-mix(in srgb,var(--turn-now) 24%,var(--surface));box-shadow:inset 5px 0 0 var(--turn-now)}
.ini-row.next{background:color-mix(in srgb,var(--turn-next) 15%,var(--surface));box-shadow:inset 4px 0 0 var(--turn-next)}
.ini-row.done{background:color-mix(in srgb,var(--turn-done) 14%,var(--surface));box-shadow:inset 3px 0 0 var(--turn-done)}
.ini-row.done .ini-name b{color:var(--muted)}
.ini-row.now .ini-name b{font-weight:800}
.ini-mark{font-size:1.1rem;text-align:center;color:var(--muted)}
.ini-row.now .ini-mark{color:var(--turn-now)}.ini-row.next .ini-mark{color:var(--turn-next)}
.ini-legend{display:flex;gap:16px;flex-wrap:wrap;padding:0 16px 12px;font-size:.85rem;color:var(--muted)}
.ini-legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.ini-name{min-width:0;display:flex;flex-direction:column}
.ini-name b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ini-name small{color:var(--muted)}
.ini-row input{width:100%;text-align:center;min-height:36px;border:1px solid var(--line);border-radius:calc(var(--r)*.75);background:var(--surface);font-variant-numeric:tabular-nums}
.ini-hp{font-family:var(--mono);font-size:.85rem;color:var(--muted);white-space:nowrap}
.ini-hp input{width:64px}
.ini-act{display:flex;gap:6px}
@media(max-width:700px){.ini-row{grid-template-columns:24px minmax(0,1fr) 70px;}.ini-hp,.ini-act{grid-column:2/-1}}
/* hp */
.hpwrap{padding:16px;display:flex;flex-direction:column;gap:14px}
.hpmax{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.hpmax b{font-family:var(--display);font-size:2.6rem;line-height:1;font-variant-numeric:tabular-nums}
.hpbar{height:14px;border-radius:999px;background:color-mix(in srgb,var(--ink) 10%,var(--surface));display:flex;overflow:hidden;border:1px solid var(--line)}
.hpbar i{display:block;height:100%}
.hpbar .cur{background:var(--accent)}.hpbar .cur.low{background:var(--danger)}.hpbar .tmp{background:var(--temp)}
.hpnums{display:flex;gap:12px;margin-top:4px;font-family:var(--mono);font-size:.85rem;color:var(--muted)}
.tt{color:var(--temp);font-family:var(--mono);font-size:.85em}
.hpgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;align-items:end}
.hpbtns{display:flex;gap:8px;flex-wrap:wrap}
.hpsub{display:flex;gap:12px 32px;flex-wrap:wrap;align-items:flex-end}
.stepper{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mono{font-family:var(--mono);font-size:.85rem}
.dots{display:flex;gap:6px}
.dot{width:20px;height:20px;border-radius:50%;border:2px solid var(--muted);background:transparent;padding:0;cursor:pointer}
.dot.on.ok{background:var(--accent);border-color:var(--accent)}
.dot.on.bad{background:var(--danger);border-color:var(--danger)}
details.how summary{cursor:pointer;color:var(--muted);font-weight:500}
details.how ul{margin:8px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:4px;font-size:.9rem}
/* saving throws and skills */
.profgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:8px 36px;padding:12px 16px 16px}
.pcol h3{font-size:1rem;color:var(--muted);margin:0 0 4px}
.prow{display:grid;grid-template-columns:28px 46px minmax(0,1fr) auto;align-items:center;gap:10px;min-height:34px;border-bottom:1px solid var(--line)}
.pv{font-family:var(--display);font-weight:700;font-size:1.1rem;text-align:right;font-variant-numeric:tabular-nums}
.prow.s2 .pv{color:var(--brass)}
.pa{font-family:var(--mono);font-size:.74rem;color:var(--muted)}
.pt{width:22px;height:22px;margin:0 3px;border-radius:50%;border:2px solid var(--muted);background:transparent;cursor:pointer;padding:0}
.pt:hover{border-color:var(--ink)}
.pt.s1{background:var(--ink);border-color:var(--ink)}
.pt.s2{background:var(--gold);border-color:var(--gold);box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--gold)}
/* site settings and dice */
.brand .logo{width:30px;height:30px;object-fit:contain;flex:none}
.sr{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
label.btn:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.medias{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;padding:0 16px 8px}
.media{display:flex;flex-direction:column;gap:8px;min-width:0}
.thumb{height:110px;border:1px dashed var(--line);border-radius:var(--r);display:grid;place-items:center;background-size:cover;background-position:center;background-repeat:no-repeat}
.thumb.logo{background-size:contain;width:110px}
.crows{display:flex;flex-direction:column}
.crow{display:grid;grid-template-columns:minmax(130px,1fr) 56px 90px auto;gap:12px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line)}
.crow:last-child{border-bottom:0}
.crow input[type=color]{width:56px;height:34px;padding:2px;border:1px solid var(--line);border-radius:calc(var(--r)*.5);background:var(--surface);cursor:pointer}
.crow code{font-family:var(--mono);font-size:.82rem;color:var(--muted)}
.pair{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-bottom:6px}
.rc{border:1px solid var(--line);border-radius:var(--r);padding:8px 18px;min-width:104px;display:flex;flex-direction:column;align-items:center;gap:2px}
.rc.kept{border-color:var(--brass);box-shadow:inset 0 0 0 1px var(--brass)}
.rc.tossed{opacity:.65}
.rc .tag{font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.rc .num{font-family:var(--display);font-size:2rem;font-weight:700;line-height:1.15;font-variant-numeric:tabular-nums}
.rc s.num{text-decoration-thickness:3px;text-decoration-color:var(--danger);color:var(--muted)}
.hist .old{color:var(--muted);font-weight:400;text-decoration-color:var(--danger)}
@media (max-width:820px){.crow{grid-template-columns:1fr 56px auto;}.crow code{display:none}
  .app.stagemode{height:100dvh;grid-template-rows:auto minmax(0,1fr)}
  .main.stage{height:auto;min-height:0}
  .stagebody{grid-template-columns:minmax(0,1fr) 128px;gap:10px}
  .rail .av{display:none}.gtabs{margin-left:0;width:100%}
  .d3 .seat-body{flex-direction:column;align-items:stretch;gap:0}
  .d3 .seat-pick{flex:none}
  .d3 .seat-stats{font-size:.72em;gap:8px}}
@media (max-width:820px){
  .subrow{grid-template-columns:minmax(0,1fr)}
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:12px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px))}
  .nav{flex-direction:row;overflow-x:auto;order:3;width:100%}
  .nav button{white-space:nowrap}
  .nav button[aria-current="page"]{box-shadow:inset 0 -3px 0 var(--brass)}
  .side-foot{margin:0 0 0 auto;flex-direction:row;align-items:center;border:0;padding:0}
  .me{display:none}
  .main{padding:20px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
  .games{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

async function api(method,path,body){
  const r=await fetch(path,{method,credentials:'same-origin',headers:{'Content-Type':'application/json','X-Requested-With':'dd'},body:body===undefined?undefined:JSON.stringify(body)});
  let j={};try{j=await r.json()}catch(e){}
  if(!r.ok){const e=new Error(j.error||('http'+r.status));e.status=r.status;e.code=j.error;throw e}
  return j;
}
function netBar(msg){let el=document.getElementById('netbar');if(!msg){if(el)el.remove();return}if(!el){el=document.createElement('div');el.id='netbar';el.className='netbar';el.setAttribute('role','alert');document.body.appendChild(el)}el.textContent=msg}
function netErr(e){

  netBar(t(e&&e.code==='rejected'?'netRejected':'netSaveFail'));
}
const synced={pc:new Map(),npc:new Map()};
let syncChain=Promise.resolve(),inflight=0;const kvTimers={};
function resetSynced(){synced.pc=new Map(pcs.map(r=>[r.id,JSON.stringify(r)]));synced.npc=new Map(npcs.map(r=>[r.id,JSON.stringify(r)]))}
function applyBoot(j){
  REMOTE=true;SITE=Object.assign({},j.site||{});firstRun=!j.hasUsers;
  if(j.me){users=j.users||[j.me];session=j.me.id;pcs=j.pcs||[];npcs=j.npcs||[];rooms=j.rooms||[];CAT=j.cat||clone(SEED);normCat();
    if(!j.cat&&j.me.role==='admin')api('POST','api/kv/cat',{value:CAT}).catch(netErr)}
  else{users=[];session=null;pcs=[];npcs=[];rooms=[]}
  resetSynced();
}
function pushKv(k,v){
  clearTimeout(kvTimers[k]);inflight++;
  kvTimers[k]=setTimeout(()=>{syncChain=syncChain.then(async()=>{try{await api('POST','api/kv/'+REMOTE_KEYS[k],{value:v});netBar('')}catch(e){netErr(e)}finally{inflight--}})},350);
}
function syncKind(k){
  const L=list(k),cur=new Map(L.map(r=>[r.id,JSON.stringify(r)]));
  const up=L.filter(r=>synced[k].get(r.id)!==cur.get(r.id)),del=[...synced[k].keys()].filter(id=>!cur.has(id));
  if(!up.length&&!del.length)return;
  synced[k]=cur;inflight++;
  syncChain=syncChain.then(async()=>{
    try{const j=await api('POST','api/sync',{kind:k,upsert:up,del});
      (j.records||[]).forEach(srv=>{const L2=list(k),i=L2.findIndex(x=>x.id===srv.id);if(i>=0){L2[i]=srv;synced[k].set(srv.id,JSON.stringify(srv))}});
      if((j.rejected||[]).length)netErr({code:'rejected'});else netBar('');
      if(!edit&&!dedit&&session)render();
    }catch(e){netErr(e)}finally{inflight--}});
}
async function pull(){
  if(!REMOTE||!session||edit||dedit||inflight)return;
  if(view!=='players'&&view!=='npcs')return;
  try{applyBoot(await api('GET','api/boot'));if(!edit&&!dedit&&!inflight)render()}catch(e){if(e.status===401)netErr(e)}
}

function lum(h){return hexRgb(h).map(v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)}).reduce((s,v,i)=>s+v*[.2126,.7152,.0722][i],0)}
function hexRgb(h){h=String(h).replace('#','');if(h.length===3)h=[...h].map(c=>c+c).join('');const n=parseInt(h,16)||0;return[n>>16&255,n>>8&255,n&255]}

function readImage(file,max,type,q){return new Promise((res,rej)=>{const fr=new FileReader();fr.onerror=rej;fr.onload=()=>{const img=new Image();img.onerror=rej;img.onload=()=>{
  const sc=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*sc));c.height=Math.max(1,Math.round(img.height*sc));
  const x=c.getContext('2d');if(type==='image/jpeg'){x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height)}x.drawImage(img,0,0,c.width,c.height);res(c.toDataURL(type,q))};img.src=fr.result};fr.readAsDataURL(file)})}

async function hashPw(pw,salt){
  try{const d=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(salt+':'+pw));return[...new Uint8Array(d)].map(x=>x.toString(16).padStart(2,'0')).join('')}
  catch(e){let h=5381;for(const c of salt+pw)h=((h*33)^c.charCodeAt(0))>>>0;return'x'+h.toString(16)}
}

async function submitAuth(form){
  const f=Object.fromEntries(new FormData(form));
  const name=(f.user||'').trim().toLowerCase();
  if(authTab==='signup'){
    if(!/^[a-z0-9_]{3,}$/.test(name))return authErr=t('eUser'),render();
    if((f.pass||'').length<6)return authErr=t('ePass'),render();
    if(f.pass!==f.pass2)return authErr=t('eMatch'),render();
    if(REMOTE)return remoteAuth('api/register',{name,disp:(f.disp||'').trim(),pass:f.pass});
    if(users.some(u=>u.name===name))return authErr=t('eTaken'),render();
    const salt=uid()+uid();
    const u={id:uid(),name,disp:(f.disp||'').trim()||name,role:users.length?'player':'admin',salt,hash:await hashPw(f.pass,salt)};
    users.push(u);put('dd_users',users);startSession(u);
  }else{
    if(REMOTE)return remoteAuth('api/login',{name,pass:f.pass||''});
    const u=users.find(x=>x.name===name);
    if(!u||u.hash!==await hashPw(f.pass||'',u.salt))return authErr=t('eBad'),render();
    startSession(u);
  }
}
async function remoteAuth(path,body){
  try{const j=await api('POST',path,body);applyBoot(j);netBar('');startSession(j.me)}
  catch(e){authErr=({bad_login:t('eBad'),name_taken:t('eTaken'),bad_name:t('eUser'),bad_pass:t('ePass'),too_many_attempts:t('eThrottle')})[e.code]||t('eNet');render()}
}

const dieOf=cls=>{const c=CAT.classes.find(x=>x.name===cls),m=c&&String(c.hd).match(/(\d+)/);return m?Number(m[1]):0};
/* HP: level 1 takes the full hit die, later levels take the fixed average, each plus CON and never less than 1.
   entries is a list so multiclass can add more rows later; the first row's level 1 gets the full die. */
function hpCalc(d){
  const lvl=Math.max(1,Math.min(20,Math.round(num(d.level))||1)),con=mod(d.abil.con),lines=[];
  const entries=[{cls:d.cls,sub:d.sub,level:lvl}];
  let total=0,first=true,missing=false;
  entries.forEach(e=>{
    const die=dieOf(e.cls),avg=Math.floor(die/2)+1;if(!die)missing=true;let from=1;
    if(first){const g=Math.max(1,die+con);total+=g;lines.push(fill(t('hpL1'),{d:die,con:sgn(con),v:g}));from=2;first=false}
    const n=e.level-from+1;
    if(n>0){const g=Math.max(1,avg+con);total+=g*n;lines.push(fill(t('hpLn'),{range:from===e.level?from:from+'–'+e.level,avg,con:sgn(con),n,v:g*n}))}
  });
  const race=CAT.races.find(x=>x.name===d.race),co=CAT.classes.find(x=>x.name===d.cls),so=co&&co.subs.find(x=>x.name===d.sub);
  [['hsRace',d.race,num(race&&race.bhp)],['hsClass',d.cls,num(co&&co.bhp)],['hsSub',d.sub,num(so&&so.bhp)]].forEach(([src,name,b])=>{
    if(!b)return;total+=b*lvl;lines.push(fill(t('hpBonus'),{src:t(src),name:esc(name),b:sgn(b),lvl,v:sgn(b*lvl)}))});
  total=Math.max(1,total);
  return{max:total,lines,lvl,die:dieOf(d.cls),missing};
}
function effMax(d){return d.hpMode==='manual'&&num(d.hpManual)>=1?Math.round(num(d.hpManual)):hpCalc(d).max}

}

   <div class="hpnums"><span id="hp_txt">${cur} / ${max}</span><span class="tt" id="hp_ttxt">${tmp?'+'+tmp+' temp':''}</span></div></div>
  <div class="hpgrid"><div class="field"><label for="hp_cur">${t('hpCur')}</label><input id="hp_cur" data-hp="cur" type="number" min="0" value="${cur}"></div>
   <div class="field"><label for="hp_temp">${t('hpTemp')}</label><input id="hp_temp" data-hp="temp" type="number" min="0" value="${tmp}"></div>

  ${adm?`<div class="hpgrid"><div class="field"><label for="hp_mode">${t('hpMode')}</label><select id="hp_mode" data-hp="mode"><option value="auto" ${d.hpMode==='manual'?'':'selected'}>${t('hpModeAuto')}</option><option value="manual" ${d.hpMode==='manual'?'selected':''}>${t('hpModeManual')}</option></select></div>
   ${d.hpMode==='manual'?`<div class="field"><label for="hp_manual">${t('hpManualVal')}</label><input id="hp_manual" data-hp="manual" type="number" min="1" value="${esc(d.hpManual)}"></div>`:''}</div>`:`<p class="note" style="margin:0">${manual?t('hpLockedManual'):t('hpLocked')}</p>`}
  <details class="how"><summary>${t('hpHow')}</summary><ul>${c.lines.map(l=>`<li>${l}</li>`).join('')}<li><b>${fill(t('hpTotal'),{v:c.max})}</b></li>${manual?`<li>${fill(t('hpOver'),{v:c.max})}</li>`:''}${c.missing?`<li class="err">${t('hpNoDie')}</li>`:''}</ul></details>`;
}

const armorBase=n=>String(n||'').trim().replace(/\s*\+\d+\s*$/,'').toLowerCase();
const armorOf=it=>{const b=armorBase(it.name);return b?CAT.armor.find(a=>String(a.name).toLowerCase()===b)||null:null};
const itemEnch=it=>{const m=String(it.name||'').match(/\+(\d+)\s*$/);return m?+m[1]:0};
const isShield=a=>/shield/i.test(a.acat||'');
/* catalog armor AC is the bonus over 10 (Leather 1 = AC 11). one body armor and one shield count. */
function acCalc(d){
  const dx=mod(d.abil.dex),lines=[],warns=[];let body=null,sh=null;
  (d.items||[]).filter(i=>i.eq).forEach(it=>{const a=armorOf(it);if(!a)return;
    if(isShield(a)){if(!sh)sh={it,a};else warns.push(fill(t('acIgnored'),{name:esc(it.name)}))}
    else{if(!body)body={it,a};else warns.push(fill(t('acIgnored'),{name:esc(it.name)}))}});
  let total;
  if(body){
    const a=body.a,armor=10+Math.round(num(a.ac))+itemEnch(body.it)+Math.round(num(a.ench));
    const heavy=/heavy/i.test(a.acat||''),md=String(a.maxdex).trim()===''?null:Math.round(num(a.maxdex));
    const dp=heavy?0:(md===null?dx:Math.min(dx,md));
    const note=heavy?' ('+t('acHeavyNoDex')+')':(md!==null&&dx>md?' ('+fill(t('acCap'),{n:md})+')':'');
    total=armor+dp;lines.push(fill(t('acBody'),{name:esc(body.it.name),armor,dex:sgn(dp),note,v:total}));
    if(num(a.str)>0&&num(d.abil.str)<num(a.str))warns.push(fill(t('acStr'),{name:esc(body.it.name),n:num(a.str),s:num(d.abil.str)}));
    if(/disadv/i.test(a.stealth||''))warns.push(fill(t('acStealth'),{name:esc(body.it.name)}));
  }else{total=10+dx;lines.push(fill(t('acNone'),{dx:sgn(dx),v:total}))}
  if(sh){const v=Math.round(num(sh.a.ac))+itemEnch(sh.it)+Math.round(num(sh.a.ench));total+=v;lines.push(fill(t('acShield'),{name:esc(sh.it.name),v:sgn(v)}))}
  return{total,lines,warns};
}

function cascade(c,old,d){
  if(pickKey[c]){if(old.name!==d.name){let c2=false;[...pcs,...npcs].forEach(r=>{const a=r.pick&&r.pick[pickKey[c]];if(a)a.forEach((x,i)=>{if(x===old.name){a[i]=d.name;c2=true}})});if(c2){commit('pc');commit('npc')}}return}
  const key=usageKey[c];if(!key)return;let ch=false;
  [...pcs,...npcs].forEach(r=>{if(old.name!==d.name&&r[key]===old.name){r[key]=d.name;ch=true}});
  if(c==='classes')(old.subs||[]).forEach(os=>{const ns=d.subs.find(s=>s.id===os.id);
    if(ns&&ns.name!==os.name)[...pcs,...npcs].forEach(r=>{if(r.cls===d.name&&r.sub===os.name){r.sub=ns.name;ch=true}})});
  if(ch){commit('pc');commit('npc')}
}
function saveData(){

  if(L.some(x=>x.id!==d.id&&x.name.toLowerCase()===d.name.toLowerCase())){dataErr=t('errDup');return render()}
  if(c==='classes'||c==='backgrounds')d.feats=(d.feats||[]).map(f=>({...f,name:String(f.name||'').trim(),lvl:Math.max(1,Math.min(20,Math.round(Number(f.lvl)||1)))})).filter(f=>f.name||String(f.desc||'').trim());

    if(new Set(d.subs.map(s=>s.name.toLowerCase())).size!==d.subs.length){dataErr=t('errSubDup');return render()}
  }
  const i=L.findIndex(x=>x.id===d.id);
  if(i>=0){cascade(c,L[i],d);L[i]=d}else L.push(d);
  put('dd_cat',CAT);dedit=null;dataErr='';render();
}

function iniAction(a,id){

  else if(a==='ini-next'||a==='ini-prev'){

  iniSort(I);saveRooms();render();

function resultHtml(){
  const r=lastRoll;if(!r)return`<div class="muted">${t('rollHint')}</div>`;
  const modTxt=r.mod?` ${sgn(r.mod)}`:'';
  if(r.rolls.length===1)return`<div class="big">${r.total}</div><div class="det">${r.n}d${r.sides} [${r.rolls[0].vals.join(', ')}]${modTxt}</div>`;
  const cards=r.rolls.map(x=>`<div class="rc ${x.kept?'kept':'tossed'}"><span class="tag">${x.kept?t('kept'):t('tossed')}</span>${x.kept?`<b class="num">${x.sum}</b>`:`<s class="num">${x.sum}</s>`}${r.n>1?`<span class="det">[${x.vals.join(', ')}]</span>`:''}</div>`).join('');
  return`<div class="pair">${cards}</div><div class="big">${r.total}</div><div class="det">${r.mode==='adv'?t('adv'):t('dis')} · ${r.rolls.find(x=>x.kept).sum}${modTxt}</div>`;
}
function doRoll(){
  const n=Math.min(20,Math.max(1,Number($('#d_count').value)||1)),m=Number($('#d_mod').value)||0;
  diceCount=n;diceMod=m;diceMode=$('#d_mode').value;
  const one=()=>1+Math.floor(Math.random()*diceSides);
  const batch=()=>{const vals=Array.from({length:n},one);return{vals,sum:vals.reduce((x,y)=>x+y,0)}};
  const A=batch(),res={n,sides:diceSides,mod:m,mode:diceMode};
  if(diceMode==='normal'){res.rolls=[{...A,kept:true}];res.base=A.sum}
  else{
    const B=batch(),keepA=diceMode==='adv'?A.sum>=B.sum:A.sum<=B.sum;
    res.rolls=[{...A,kept:keepA},{...B,kept:!keepA}];res.base=(keepA?A:B).sum;
  }
  res.total=res.base+m;lastRoll=res;
  const tossed=res.rolls.length>1?res.rolls.find(x=>!x.kept).sum+m:null;
  const label=`${n}d${diceSides}${m?sgn(m):''}${diceMode==='normal'?'':' '+(diceMode==='adv'?'adv':'dis')}`;
  rolls.unshift({label,total:res.total,tossed});rolls=rolls.slice(0,8);render();
}

const bkOkArr=(a,f)=>Array.isArray(a)&&a.every(x=>x&&typeof x==='object'&&f(x));
function bkApply(text){

  if(!d.users.some(u=>u.role==='admin'))return{err:t('bkNoAdmin')};
  if(REMOTE)return api('POST','api/import',d).then(async()=>{applyBoot(await api('GET','api/boot'));siteDraft=clone(SITE);edit=null;dedit=null;roomOpen=null;roomEdit=null;return{ok:true}}).catch(()=>({err:t('netSaveFail')}));

async function bkAction(a){
  if(a!=='bk-import')dataArm=null;

  if(a==='bk-dl'){
    const text=bkBuild(),name='acacia-watch-backup-'+new Date().toISOString().slice(0,10)+'.json';let done=false;
    try{const dl=await claude.use('downloads');if(dl){await dl.save({filename:name,data:text});bkMsg=t('bkSaved');done=true}}
    catch(e){if(e&&e.code==='declined'){render();return}}
    if(!done){try{const u=URL.createObjectURL(new Blob([text],{type:'application/json'})),x=document.createElement('a');x.href=u;x.download=name;document.body.appendChild(x);x.click();x.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);bkMsg=t('bkSaved')}catch(e){bkMsg=t('bkDlFail')}}
    render();return}
  if(a==='bk-copy'){
    try{await navigator.clipboard.writeText(bkBuild());bkMsg=t('bkCopied');render()}

    api('POST','api/users/'+id+'/delete',{}).then(()=>{users=users.filter(x=>x.id!==id);pcs.forEach(r=>{if(r.owner===id)r.owner=''});resetSynced();flashMsg='';render()}).catch(e=>{flashMsg=e.code==='last_admin'?t('lastAdmin'):t('netSaveFail');render()})}
  else if(a==='sample'){sample(k).forEach(x=>list(k).push(x));commit(k);render()}
  else if(a==='radd'){roomEdit={draft:{id:uid(),name:'',seats:4,assign:[]},isNew:true};roomErr='';render()}
  else if(a==='redit'){roomEdit={draft:clone(rooms.find(x=>x.id===id)),isNew:false};roomErr='';render()}
  else if(a==='rback'){roomEdit=null;roomErr='';render()}
  else if(a==='rsave'){
    const d=roomEdit.draft,n=Math.round(Number(d.seats));
    if(!(n>=1&&n<=MAXSEATS)){roomErr=t('errSeats');return render()}
    d.seats=n;d.name=String(d.name||'').trim()||t('roomDefault')+' '+(rooms.length+(roomEdit.isNew?1:0));
    d.assign=Array.from({length:n},(_,i)=>d.assign[i]||'');
    const i=rooms.findIndex(x=>x.id===d.id);if(i>=0)rooms[i]=d;else rooms.push(d);
    saveRooms();roomEdit=null;roomErr='';render()}
  else if(a==='rdel'){if(dataArm!=='room:'+id){dataArm='room:'+id;render();return}rooms=rooms.filter(x=>x.id!==id);saveRooms();dataArm=null;render()}
  else if(a==='ropen'){roomOpen=id;render()}
  else if(a==='rclose'){roomOpen=null;render()}
  else if(a==='rgame'){advGame=v;render()}
  else if(a==='simg-rm'){siteDraft[k]='';siteErr='';render()}
  else if(a==='sc-reset'){delete siteDraft[k];render()}
  else if(a==='srevert'){siteDraft=clone(SITE);siteMsg='';siteErr='';render()}
  else if(a==='ssave'){SITE=clone(siteDraft);for(const x in SITE)if(SITE[x]===''||SITE[x]===undefined)delete SITE[x];siteMsg=put('dd_site',SITE)?t('sSaved'):t('sSavedTemp');siteDraft=clone(SITE);render()}
  else if(a==='sresetall'){if(dataArm!=='siteReset'){dataArm='siteReset';render();return}SITE={};siteDraft={};put('dd_site',SITE);dataArm=null;siteMsg=t('sSaved');render()}
  else if(a==='dtab'){dataTab=v;dataArm=null;render()}
  else if(a==='dnew'){dedit={cat:dataTab,draft:blankItem(dataTab),isNew:true};dataErr='';dataArm=null;render()}
  else if(a==='dedit'){dedit={cat:dataTab,draft:clone(CAT[dataTab].find(x=>x.id===id)),isNew:false};dataErr='';dataArm=null;render()}
  else if(a==='dback'){dedit=null;dataErr='';dataArm=null;render()}
  else if(a==='dsave'){saveData()}
  else if(a==='ddel'||a==='ddel-edit'){
    const rid=a==='ddel'?id:dedit.draft.id,c=a==='ddel'?dataTab:dedit.cat;
    if(dataArm!==rid){dataArm=rid;render();return}
    CAT[c]=CAT[c].filter(x=>x.id!==rid);put('dd_cat',CAT);dataArm=null;dedit=null;render()}
  else if(a==='dreset'){if(dataArm!=='reset'){dataArm='reset';render();return}CAT[dataTab]=clone(SEED[dataTab]);put('dd_cat',CAT);dataArm=null;render()}
  else if(a==='ftadd'){dedit.draft.feats=dedit.draft.feats||[];dedit.draft.feats.push({id:uid(),name:'',lvl:1,desc:''});render()}
  else if(a==='ftdel'){dedit.draft.feats.splice(Number(b.dataset.i),1);render()}
  else if(a==='subadd'){dedit.draft.subs.push({id:uid(),name:'',alt:'',bhp:'',prof:''});render()}
  else if(a==='subdel'){dedit.draft.subs.splice(Number(b.dataset.i),1);render()}
  else if(a==='side'){diceSides=Number(v);render()}
  else if(a==='roll'){doRoll()}
});
document.addEventListener('submit',e=>{if(e.target.id==='authForm'){e.preventDefault();submitAuth(e.target)}});
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.dataset.bk){if(el.dataset.bk==='text')bkText=el.value;return}
  if(view==='site'&&siteDraft&&(el.dataset.sk||el.dataset.s)){
    if(el.dataset.sk){siteDraft[el.dataset.sk]=el.value;const h=$('#hx_'+el.dataset.sk);if(h)h.textContent=el.value}
    else{const f=el.dataset.s;siteDraft[f]=['radius','fxms','fxamt'].includes(f)?Number(el.value):el.value;const sp=f==='radius'?$('#rv'):$('#v_'+f);if(sp)sp.textContent=el.value}
    applySite(siteDraft);const bd=document.querySelector('.side .brand');if(bd)bd.innerHTML=brandHtml();return;
  }
  if(roomEdit&&el.dataset.r){roomEdit.draft[el.dataset.r]=el.value;return}
  if(dedit){
    const dd=dedit.draft;
    if(el.dataset.cf){const f=el.dataset.cf;dd[f]=el.tagName==='SELECT'?Number(el.value):(el.type==='number'?(el.value===''?'':Number(el.value)):el.value)}
    else if(el.dataset.sf){dd.subs[Number(el.dataset.si)][el.dataset.sf]=el.value}
    else if(el.dataset.ftf){const f=(dd.feats||[])[Number(el.dataset.fti)];if(f)f[el.dataset.ftf]=el.dataset.ftf==='lvl'?Number(el.value):el.value}
    else if(el.dataset.bgs){const a=dd.sk=dd.sk||[],k=el.dataset.bgs,ix=a.indexOf(k);if(el.checked&&ix<0)a.push(k);if(!el.checked&&ix>=0)a.splice(ix,1)}
    return;
  }
  if(!edit)return;const d=edit.draft;
  if(el.dataset.it){const it=d.items.find(x=>x.id===el.dataset.id);if(it){if(el.dataset.it==='name'){it.name=el.value;schedRefresh({a:1})}else if(el.dataset.it==='qty')it.qty=Math.max(1,Math.round(num(el.value))||1)}return}
  if(el.dataset.ac){if(el.dataset.ac==='mode'){d.acMode=el.value;refreshAc('ac_mode');return}d.acManual=el.value;const av=document.getElementById('ac_val');if(av)av.textContent=effAc(d);return}
  if(el.dataset.hp){const h=el.dataset.hp;
    if(h==='mode'){d.hpMode=el.value;refreshHp('hp_mode');return}
    if(h==='cur')d.hpCur=el.value===''?null:Math.max(0,Math.round(num(el.value)));
    else if(h==='temp')d.hpTemp=Math.max(0,Math.round(num(el.value)));
    else if(h==='manual')d.hpManual=el.value;
    updateHpBar();return}
  if(el.dataset.a){d.abil[el.dataset.a]=Number(el.value)||10;const m=$('#m_'+el.dataset.a);if(m)m.textContent=sgn(mod(d.abil[el.dataset.a]));$('#derived').innerHTML=derived(d);schedRefresh({h:el.dataset.a==='con',a:el.dataset.a==='dex'||el.dataset.a==='str'})}
  else if(el.dataset.f&&el.tagName!=='SELECT'){
    const f=el.dataset.f;d[f]=el.type==='number'?Number(el.value):el.value;
    if(f==='level'||f==='dex')$('#derived').innerHTML=derived(d);
    if(f==='level')schedRefresh({h:1,f:1});
  }
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.dataset.bk==='file'){const f=el.files&&el.files[0];if(!f)return;const fr=new FileReader();fr.onload=()=>{bkText=String(fr.result||'');bkMsg=fill(t('bkLoaded'),{n:Math.round(bkText.length/1024)});dataArm=null;render()};fr.onerror=()=>{bkMsg=t('bkBad');render()};fr.readAsText(f);return}
  if(el.dataset.sk){render();return}
  if(el.dataset.ini){iniChange(el);return}
  if(el.dataset.it&&edit){itChange(el);return}
  if(el.dataset.ac&&edit&&el.dataset.ac==='mode'){edit.draft.acMode=el.value;refreshAc('ac_mode');return}
  if(el.dataset.seat!==undefined){const rm=rooms.find(r=>r.id===roomOpen);if(rm){rm.assign[Number(el.dataset.seat)]=el.value;saveRooms();render()}return}
  if(el.dataset.img){
    const f=el.files&&el.files[0];if(!f)return;const k=el.dataset.img;siteErr='';
    readImage(f,k==='logo'?256:1600,k==='logo'?'image/png':'image/jpeg',.82).then(u=>{siteDraft[k]=u;render()}).catch(()=>{siteErr=t('sImgErr');render()});return}
  if(el.dataset.act==='role'){
    const u=users.find(x=>x.id===el.dataset.id),admins=users.filter(x=>x.role==='admin').length;
    if(u.role==='admin'&&el.value==='player'&&admins<2){flashMsg=t('lastAdmin');render();return}
    const prev=u.role;u.role=el.value;put('dd_users',users);flashMsg='';
    if(REMOTE)api('POST','api/users/'+u.id+'/role',{role:u.role}).catch(e=>{u.role=prev;flashMsg=e.code==='last_admin'?t('lastAdmin'):t('netSaveFail');render()});
    if(u.id===session&&u.role!=='admin')view='players';render();return}
  if(edit&&el.dataset.wk){const r=edit.draft.weapons.find(x=>x.id===el.dataset.id);if(r){if(el.dataset.wk==='p')r.p=el.checked;else r.bonus=Math.round(num(el.value))}refreshWeapons();return}
  if(edit&&el.dataset.pk){const a=edit.draft.pick[el.dataset.pk]=edit.draft.pick[el.dataset.pk]||[];a[Number(el.dataset.pi)]=el.value;return}
  if(!edit||!el.dataset.f)return;const d=edit.draft,f=el.dataset.f;
  if(f==='insp')d.insp=el.value==='1';else d[f]=el.value;
  if(f==='cls'){d.sub='';$('#e_sub').innerHTML=subOpts(d.cls,'')}
  if(f==='bg'){syncBgItems(d);render()}
  if(f==='cls'||f==='sub'||f==='race'){refreshHp();refreshExtra()}
});
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(me()&&['players','npcs','data','games','site','adventure'].includes(h)&&h!==view&&(isAdmin()||h==='players')){view=h;edit=null;dedit=null;roomOpen=null;roomEdit=null;siteDraft=h==='site'?clone(SITE):null;render()}});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)pull()});
async function boot(){
  const served=!!document.querySelector('meta[name=dd-server]');
  if(served)try{
    const ac=new AbortController(),tm=setTimeout(()=>ac.abort(),8000);
    const r=await fetch('api/boot',{credentials:'same-origin',headers:{'X-Requested-With':'dd'},signal:ac.signal});clearTimeout(tm);
    if(r.ok&&/json/.test(r.headers.get('content-type')||''))applyBoot(await r.json());
    else throw new Error('boot');
  }catch(e){
    {$('#root').innerHTML='<div class="login"><div class="login-card"><h1 style="margin:0">'+t('netDown')+'</h1><button class="btn primary" id="retryBoot" type="button">'+t('netRetry')+'</button></div></div>';document.getElementById('retryBoot').onclick=()=>location.reload();return}
  }
  const h=location.hash.slice(1);if(['players','npcs','data','games','site','adventure'].includes(h))view=h;
  if(session&&!me())session=null;
  render();
}
boot();
</script>
